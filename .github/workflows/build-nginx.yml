# .github/workflows/build-nginx-static.yml
name: Build Static Nginx

# ── 默认版本前缀（schedule 触发时 inputs 为空，回退到这里；改版本只动这一处）──
env:
  OPENSSL_MAJOR_DEFAULT: '4.0'
  NGINX_MAJOR_DEFAULT: '1.31'

on:
  schedule:
    - cron: '0 1 * * *'   # UTC 01:00 = 北京时间 09:00，每天一次
  workflow_dispatch:
    inputs:
      openssl_major:
        description: 'OpenSSL 版本前缀 (如: 3.4 / 3.3 / 3.2 / 1.1.1)，留空使用默认值'
        required: false
        default: ''
      nginx_major:
        description: 'Nginx 版本前缀 (如: 1.31 / 1.28 / 1.26)，留空使用默认值'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布 Release 需要
    outputs:
      nginx_ver: ${{ steps.nginx.outputs.version }}
      openssl_ver: ${{ steps.openssl.outputs.version }}
    container:
      image: alpine:latest   # musl libc，天然适合全静态编译

    steps:
      # ── 1. 安装编译依赖 ──────────────────────────────────────────
      - name: Install build dependencies
        run: |
          apk add --no-cache \
             linux-headers \
             musl-dev \
             cmake \
             build-base \
             zlib-dev \
             zlib-static \
             curl \
             tar \
             bash \
             vim \
             git \
             perl \
             tzdata \
             ca-certificates \
             jq \
             github-cli \
             brotli-dev \
             brotli-static \
             file
      # ── 2. 解析 OpenSSL 最新小版本号 ─────────────────────────────
      - name: Resolve latest OpenSSL version
        id: openssl
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="${{ inputs.openssl_major || env.OPENSSL_MAJOR_DEFAULT }}"
          ESCAPED="${PREFIX//./\\.}"

          echo "🔍 Searching OpenSSL ${PREFIX}.x ..."

          # 优先：官方 source 页（当前维护版本）
          LATEST=$(curl -sf "https://www.openssl.org/source/" \
            | grep -oE "openssl-${ESCAPED}(\.[0-9]+|[a-z])\.tar\.gz" \
            | sed 's/\.tar\.gz//' | sort -V | tail -1 || true)

          # 其次：旧版归档页
          if [[ -z "$LATEST" ]]; then
            LATEST=$(curl -sf "https://www.openssl.org/source/old/${PREFIX}/" \
              | grep -oE "openssl-${ESCAPED}(\.[0-9]+|[a-z])\.tar\.gz" \
              | sed 's/\.tar\.gz//' | sort -V | tail -1 || true)
          fi

          # 兜底：GitHub Tags API（处理未归档的新版）
          if [[ -z "$LATEST" ]]; then
            for PAGE in 1 2 3 4 5; do
              RAW=$(curl -sf \
                "https://api.github.com/repos/openssl/openssl/tags?per_page=100&page=${PAGE}") || break
              [[ -z "$RAW" || "$RAW" == "[]" ]] && break

              MATCH=$(echo "$RAW" \
                | grep -oE '"openssl-[^"]+"' | tr -d '"' \
                | grep -E "^openssl-${ESCAPED}(\.[0-9]+|[a-z])$" \
                | sort -V | tail -1 || true)
              [[ -n "$MATCH" ]] && LATEST="$MATCH" && break

              COUNT=$(echo "$RAW" | grep -c '"name"' || echo 0)
              [[ $COUNT -lt 100 ]] && break
            done
          fi

          [[ -z "$LATEST" ]] && { echo "❌ No OpenSSL found for prefix: ${PREFIX}"; exit 1; }

          VER="${LATEST#openssl-}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "✅ OpenSSL: ${VER}"

      # ── 3. 恢复 OpenSSL 工具链缓存 ───────────────────────────────
      # key 精确到小版本：openssl 不升级则永远命中，升级后自动 miss 重建。
      # 故意不用 restore-keys——绝不能让旧小版本的库冒充新版本。
      # v1 是构建配置版本号：以后改 Configure 选项时把它升成 v2 即可全员失效。
      - name: Restore OpenSSL toolchain cache
        id: openssl-cache
        uses: actions/cache/restore@v4
        with:
          path: toolchain
          key: openssl-toolchain-${{ steps.openssl.outputs.version }}-v1

      # ── 4. 解析 Nginx 最新小版本号 ───────────────────────────────
      - name: Resolve latest Nginx version
        id: nginx
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="${{ inputs.nginx_major || env.NGINX_MAJOR_DEFAULT }}"   # schedule 触发时 inputs 为空，回退默认值
          ESCAPED="${PREFIX//./\\.}"

          echo "🔍 Searching Nginx ${PREFIX}.x ..."

          LATEST=$(curl -sf "https://nginx.org/en/download.html" \
            | grep -oE "nginx-${ESCAPED}\.[0-9]+" \
            | sort -V | tail -1 || true)

          [[ -z "$LATEST" ]] && { echo "❌ No Nginx found for prefix: ${PREFIX}"; exit 1; }

          VER="${LATEST#nginx-}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "✅ Nginx: ${VER}"

      # ── 5. 下载源码 ───────────────────────────────────────────────
      - name: Download sources
        shell: bash
        run: |
          set -euo pipefail
          OPENSSL_VER="${{ steps.openssl.outputs.version }}"
          NGINX_VER="${{ steps.nginx.outputs.version }}"

          # OpenSSL 源码仅在缓存未命中（需要自建工具链）时才下载
          if [[ "${{ steps.openssl-cache.outputs.cache-hit }}" != "true" ]]; then
            MINOR_PREFIX="${OPENSSL_VER%.*}"

            # 优先 current source，回退到 old archive
            PRIMARY="https://www.openssl.org/source/openssl-${OPENSSL_VER}.tar.gz"
            FALLBACK="https://www.openssl.org/source/old/${MINOR_PREFIX}/openssl-${OPENSSL_VER}.tar.gz"

            if wget -q --spider "${PRIMARY}" 2>/dev/null; then
              echo "📦 OpenSSL (current): ${PRIMARY}"
              wget -q "${PRIMARY}"
            else
              echo "📦 OpenSSL (archive): ${FALLBACK}"
              wget -q "${FALLBACK}"
            fi
            tar xzf "openssl-${OPENSSL_VER}.tar.gz"
          else
            echo "⏭️ Toolchain cache hit, skip OpenSSL source download"
          fi

          echo "📦 Nginx: https://nginx.org/download/nginx-${NGINX_VER}.tar.gz"
          wget -q "https://nginx.org/download/nginx-${NGINX_VER}.tar.gz"

          tar xzf "openssl-${OPENSSL_VER}.tar.gz"
          tar xzf "nginx-${NGINX_VER}.tar.gz"

          # PCRE2 源码（由 nginx --with-pcre 自行静态编译，不依赖系统包）
          PCRE2_TAG=$(curl -sf https://api.github.com/repos/PCRE2Project/pcre2/releases/latest \
            | grep -oE '"tag_name": *"pcre2-[0-9.]+"' | cut -d'"' -f4)
          [[ -z "$PCRE2_TAG" ]] && { echo "❌ Cannot resolve latest PCRE2 version"; exit 1; }
          echo "📦 PCRE2: ${PCRE2_TAG}"
          wget -q "https://github.com/PCRE2Project/pcre2/releases/download/${PCRE2_TAG}/pcre2-${PCRE2_TAG#pcre2-}.tar.gz"
          tar xzf "pcre2-${PCRE2_TAG#pcre2-}.tar.gz"

          wget -q https://github.com/openresty/headers-more-nginx-module/archive/refs/heads/master.tar.gz \
            -O headers-more-nginx-module.tar.gz
          tar xzf headers-more-nginx-module.tar.gz

          wget -q https://github.com/winshining/nginx-http-flv-module/archive/refs/heads/master.tar.gz \
            -O nginx-http-flv-module.tar.gz
          tar xzf nginx-http-flv-module.tar.gz

          wget -q https://github.com/AirisX/nginx_cookie_flag_module/archive/refs/heads/master.tar.gz \
            -O nginx_cookie_flag_module.tar.gz
          tar xzf nginx_cookie_flag_module.tar.gz

          # ngx_brotli 依赖 deps/brotli 子模块，GitHub archive 不含子模块，必须 git clone
          git clone --recursive --depth 1 \
            https://github.com/google/ngx_brotli.git ngx_brotli


      # ── 6. OpenSSL 工具链：命中缓存直接用，未命中才编译 ──────────
      # 工具链 = install_sw(bin/include/静态.a) + install_ssldirs(ssl/openssl.cnf)。
      # nginx 不再用 --with-openssl 内嵌编译 openssl，改为 -I/-L 直接链接这套静态库，
      # 因此 openssl 只在版本变化时编译一次，之后全程走缓存。
      # 注意：缓存目录必须放 workspace 内（toolchain/），actions/cache 在容器 job 里
      # 从宿主侧读写，看不到容器内的 /tmp。
      - name: Build and package static OpenSSL toolchain
        shell: bash
        run: |
          set -euo pipefail
          OPENSSL_VER="${{ steps.openssl.outputs.version }}"
          TOOLCHAIN_DIR="$GITHUB_WORKSPACE/toolchain"

          if [[ -x "$TOOLCHAIN_DIR/usr/local/bin/openssl" ]]; then
            echo "🎯 Cache hit for OpenSSL ${OPENSSL_VER}, skip building"
            CACHED_VER=$("$TOOLCHAIN_DIR/usr/local/bin/openssl" version)
            [[ "$CACHED_VER" == "OpenSSL ${OPENSSL_VER}"* ]] \
              || { echo "❌ Cached toolchain version mismatch: ${CACHED_VER}"; exit 1; }
          else
            echo "🔨 Cache miss, building OpenSSL ${OPENSSL_VER} toolchain ..."

            cp -a "openssl-${OPENSSL_VER}" openssl-toolchain
            cd openssl-toolchain

            # no-shared: 只出静态库    no-async: musl 静态编译必需
            # no-module: provider 编进 libcrypto（全静态 CLI 无法 dlopen 外部 .so）
            # -static:   Configure 认识该选项并透传给编译/链接器，CLI 全静态
            ./config --prefix=/usr/local no-shared no-async no-module -static

            make -j"$(nproc)" build_sw
            make install_sw install_ssldirs DESTDIR="$TOOLCHAIN_DIR"

            OPENSSL_BIN="$TOOLCHAIN_DIR/usr/local/bin/openssl"
            [[ -x "$OPENSSL_BIN" ]] || { echo "❌ openssl binary missing after install"; exit 1; }

            echo "=== OpenSSL toolchain verification ==="
            file "$OPENSSL_BIN"
            ldd "$OPENSSL_BIN" 2>&1 || echo "✅ Fully static binary confirmed"
            "$OPENSSL_BIN" version -a
            "$OPENSSL_BIN" list -providers

            strip "$OPENSSL_BIN"
            cd "$GITHUB_WORKSPACE"   # miss 分支进过 openssl-toolchain/，切回工作区根目录
          fi

          # 装进容器的 /usr/local，供 nginx 用 -I/-L 链接（容器每轮全新，无残留）
          cp -a "$TOOLCHAIN_DIR/usr/local/." /usr/local/

          ARCHIVE="openssl-${OPENSSL_VER}_linux-amd64-static.tar.gz"
          tar czf "${ARCHIVE}" -C "$TOOLCHAIN_DIR/usr/local" .
          echo "📦 Output: ${ARCHIVE} ($(ls -lh "${ARCHIVE}" | awk '{print $5}'))"
          echo "openssl_archive_name=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Save OpenSSL toolchain cache
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: toolchain
          key: openssl-toolchain-${{ steps.openssl.outputs.version }}-v1

      # ── 7. 静态编译 ───────────────────────────────────────────────
      - name: Configure and build static Nginx
        shell: bash
        run: |
          set -euo pipefail
          NGINX_VER="${{ steps.nginx.outputs.version }}"

          PCRE2_DIR=$(ls -d pcre2-* | head -1)
          [[ -z "$PCRE2_DIR" ]] && { echo "❌ PCRE2 source directory not found"; exit 1; }

          # ── 编译静态 brotli 库（filter 需要 enc+common，static 还需要 dec）──
          ( cd ngx_brotli/deps/brotli \
            && mkdir -p out && cd out \
            && cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
                 -DCMAKE_C_FLAGS="-O2" .. \
            && cmake --build . --config Release \
                 --target brotlienc brotlicommon brotlidec -j"$(nproc)" )

          cd "nginx-${NGINX_VER}"

          # OpenSSL：-I/-L 链接上一步装入 /usr/local 的工具链静态库
          # （gcc 默认搜索路径本就含 /usr/local，显式 -I/-L 只是加固）
          ./configure \
            --prefix=/usr/local/nginx \
            --error-log-path=/var/log/nginx/error.log \
            --http-log-path=/var/log/nginx/access.log \
            --pid-path=/var/run/nginx.pid \
            --lock-path=/var/run/nginx.lock \
            --with-compat \
            --with-threads \
            --with-http_stub_status_module \
            --with-http_ssl_module \
            --with-http_realip_module \
            --with-http_v2_module \
            --with-http_v3_module \
            --with-stream \
            --with-stream_realip_module \
            --with-stream_ssl_module \
            --with-stream_ssl_preread_module \
            --with-http_gzip_static_module \
            --with-http_gunzip_module \
            --with-http_mp4_module \
            --with-pcre-jit \
            --with-debug \
            --without-select_module \
            --without-poll_module \
            --without-http_userid_module \
            --without-http_mirror_module \
            --without-http_autoindex_module \
            --with-http_sub_module \
            --without-http_fastcgi_module \
            --without-http_uwsgi_module \
            --without-http_scgi_module \
            --without-http_memcached_module \
            --without-mail_pop3_module \
            --without-mail_imap_module \
            --without-mail_smtp_module \
            --without-http_ssi_module \
            --with-pcre="../${PCRE2_DIR}" \
            --add-module="../headers-more-nginx-module-master" \
            --add-module="../nginx-http-flv-module-master" \
            --add-module="../nginx_cookie_flag_module-master" \
            --add-module="../ngx_brotli" \
            --with-cc-opt="-O2 -I/usr/local/include" \
            --with-ld-opt="-static -L/usr/local/lib -lpthread -ldl -lstdc++ -lm"

          make -j$(nproc)

          echo ""
          echo "=== Binary verification ==="
          file objs/nginx
          ldd objs/nginx 2>&1 || echo "✅ Static binary confirmed (no dynamic deps)"
          ls -lh objs/nginx

      # ── 8. 打包产物 ───────────────────────────────────────────────
      - name: Strip and package
        shell: bash
        run: |
          OPENSSL_VER="${{ steps.openssl.outputs.version }}"
          NGINX_VER="${{ steps.nginx.outputs.version }}"
          ARCHIVE="nginx-${NGINX_VER}_openssl-${OPENSSL_VER}_linux-amd64-static.tar.gz"

          strip "nginx-${NGINX_VER}/objs/nginx"
          tar czf "${ARCHIVE}" -C "nginx-${NGINX_VER}/objs" nginx

          echo "📦 Output: ${ARCHIVE} ($(ls -lh "${ARCHIVE}" | awk '{print $5}'))"
          echo "archive_name=${ARCHIVE}" >> "$GITHUB_ENV"

      # ── 9. 发布到 Releases（固定 latest，保留最新的一对文件）──────
      - name: Publish to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ env.archive_name }}
          OPENSSL_ARCHIVE: ${{ env.openssl_archive_name }}
        run: |
          set -euo pipefail
          TAG="latest"

          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 删掉旧资产，保证 release 下只有最新的一对文件
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
              | while read -r asset; do
                  echo "🗑️ Deleting old asset: ${asset}"
                  gh release delete-asset "$TAG" "$asset" -R "$GITHUB_REPOSITORY" --yes
                done
            gh release upload "$TAG" "$ARCHIVE" "$OPENSSL_ARCHIVE" -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" "$OPENSSL_ARCHIVE" -R "$GITHUB_REPOSITORY" \
              --title "nginx static build (linux-amd64)" \
              --notes "nginx-${{ steps.nginx.outputs.version }} + openssl-${{ steps.openssl.outputs.version }} 全静态编译"
          fi

          echo "🚀 Released: ${ARCHIVE} + ${OPENSSL_ARCHIVE} -> tag ${TAG}"

  # ── 10. Telegram 通知（成功失败都发）─────────────────────────
  notify:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Telegram notification
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESULT: ${{ needs.build.result }}
          NGINX_VER: ${{ needs.build.outputs.nginx_ver }}
          OPENSSL_VER: ${{ needs.build.outputs.openssl_ver }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name == 'schedule' && '⏰ 定时' || github.event_name == 'workflow_dispatch' && '🔧 手动' || github.event_name }}
        run: |
          if [[ "$RESULT" == "success" ]]; then ICON="✅"; else ICON="❌"; fi
          TEXT="${ICON} [nginx-build] ${RESULT} (${TRIGGER}) | nginx: ${NGINX_VER:-?} / openssl: ${OPENSSL_VER:-?}
          ${RUN_URL}"
          curl -sS --fail -o /dev/null -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode "text=${TEXT}"
