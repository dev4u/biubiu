# .github/workflows/build-nginx-static.yml
name: Build Static Nginx

# nginx 与 OpenSSL 默认都追 GitHub master 分支（OpenSSL 可手动触发时指定分支/tag）
# 缓存策略（源码 + 编译产物一起缓存，make 增量编译，只重编改动的文件）：
#   - openssl-build-*：OpenSSL 源码 + 编译产物，key 按 run_id 每轮唯一，
#     restore-keys 前缀命中最近一次构建树，fetch+reset 更新后增量 make
#   - nginx-master-*：Nginx 源码 + objs/，同上
#   - pcre2-v1-*：PCRE2 源码 + 编译产物，key 精确到版本、不用 restore-keys
#     （绝不能让旧版本的库冒充新版本），版本不变永远命中
#   - 改编译选项时把对应 key/restore-keys 里的 v1 升成 v2，全员失效重建
#   - 每轮都重跑 configure/Configure 以与最新源码保持一致，但生成文件
#     （ngx_auto_config.h / configuration.h / configdata.pm 等）内容没变时
#     恢复旧 mtime，否则 make 会因时间戳变化而全量重编、增量失效
#   - git reset --hard 会重写全部跟踪文件的 mtime，更新源码后把内容未变的
#     文件回拨到旧时间戳，make 只重编真正变化的文件
#   - 每轮成功后主动删除被取代的旧缓存（Prune 步骤），配额占用恒定，
#     不再依赖 GitHub 的 LRU 被动淘汰

on:
  schedule:
    - cron: '0 1 * * *'   # UTC 01:00 = 北京时间 09:00，每天一次
  workflow_dispatch:
    inputs:
      openssl_ref:
        description: 'OpenSSL ref（分支或 tag，如 master / openssl-4.0.3，仅支持 3.0+），留空使用 master'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布 Release 需要
      actions: write    # gh cache delete 清理旧缓存需要
    outputs:
      nginx_ver: ${{ steps.nginx.outputs.version }}
      nginx_commit: ${{ steps.nginx.outputs.commit }}
      openssl_ver: ${{ steps.openssl.outputs.version }}
      openssl_ref: ${{ steps.openssl.outputs.ref }}
      openssl_commit: ${{ steps.openssl.outputs.commit }}
    container:
      image: alpine:latest   # musl libc，天然适合全静态编译

    steps:
      # ── 1. 安装编译依赖 ──────────────────────────────────────────
      - name: Install build dependencies
        # 注意：这步不能指定 shell: bash——它就是装 bash 的步骤，此时容器里还没有；
        # 纯 apk add 命令在 busybox sh 下也能跑
        run: |
          apk add --no-cache \
             linux-headers \
             musl-dev \
             cmake \
             build-base \
             zlib-dev \
             zlib-static \
             curl \
             tar \
             bash \
             vim \
             git \
             perl \
             tzdata \
             ca-certificates \
             jq \
             github-cli \
             brotli-dev \
             brotli-static \
             file

      # ── 2. 解析 PCRE2 最新版本 ───────────────────────────────────
      - name: Resolve latest PCRE2 version
        id: pcre2
        shell: bash
        run: |
          set -euo pipefail
          PCRE2_TAG=$(curl -sf --retry 3 https://api.github.com/repos/PCRE2Project/pcre2/releases/latest \
            | grep -oE '"tag_name": *"pcre2-[0-9.]+"' | cut -d'"' -f4)
          [[ -z "$PCRE2_TAG" ]] && { echo "❌ Cannot resolve latest PCRE2 version"; exit 1; }
          echo "version=${PCRE2_TAG#pcre2-}" >> "$GITHUB_OUTPUT"
          echo "✅ PCRE2: ${PCRE2_TAG}"

      # ── 3. 恢复 OpenSSL 构建树缓存（源码 + 编译产物）────────────
      # restore-keys 前缀命中最近一次构建树；命中后只需 fetch 增量更新源码，
      # make 只重编改动的文件。v1 是构建配置版本号，改 Configure 选项时升 v2
      - name: Restore OpenSSL build tree cache
        id: openssl-cache
        uses: actions/cache/restore@v4
        with:
          path: openssl-build
          key: openssl-build-v1-${{ github.run_id }}
          restore-keys: openssl-build-v1

      # ── 4. 恢复 Nginx 源码 + 编译产物缓存 ────────────────────────
      - name: Restore Nginx build tree cache
        id: nginx-cache
        uses: actions/cache/restore@v4
        with:
          path: nginx-master
          key: nginx-master-v1-${{ github.run_id }}
          restore-keys: nginx-master-v1

      # ── 5. 恢复 PCRE2 缓存 ───────────────────────────────────────
      # key 精确到版本、故意不用 restore-keys：版本升级后必须换新源码
      - name: Restore PCRE2 cache
        id: pcre2-cache
        uses: actions/cache/restore@v4
        with:
          path: pcre2-src
          key: pcre2-v1-${{ steps.pcre2.outputs.version }}

      # ── 6. 更新 OpenSSL 源码并编译静态工具链 ─────────────────────
      # 默认追 master；手动触发可用 openssl_ref 指定分支或 tag（如 openssl-4.0.3）。
      # 缓存命中的构建树直接 fetch+reset 到目标 ref 增量编译；fetch/reset 失败
      # （如跨 ref 切换撞上未跟踪文件）则重新 clone 兜底。
      # 工具链 = install_sw(bin/include/静态.a) + install_ssldirs(ssl/openssl.cnf)。
      # nginx 不内嵌编译 openssl，改为 -I/-L 直接链接这套静态库；
      # install 只要几秒，toolchain/ 每轮现场生成，不再单独缓存。
      - name: Build and package static OpenSSL toolchain
        id: openssl
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ inputs.openssl_ref || 'master' }}"
          TOOLCHAIN_DIR="$GITHUB_WORKSPACE/toolchain"

          echo "🔍 OpenSSL ref: ${REF}"
          if [[ -d openssl-build/.git ]]; then
            echo "⏭️ OpenSSL build tree restored from cache, updating ..."
            BEFORE=$(git -C openssl-build rev-parse HEAD)
            if git -C openssl-build fetch --depth 1 origin "${REF}" \
               && git -C openssl-build reset --hard FETCH_HEAD; then
              # reset --hard 会重写全部跟踪文件（日志 "Updating files: N/N"），
              # mtime 全变新后 openssl 的 configdata.pm 过期检测/依赖判断会误判
              # → 全量重编。把内容未变的文件 mtime 回拨到固定旧时间戳（48h 前，
              # 严格早于缓存中的 configdata.pm 和一切 .o），真正变化的保持新
              # mtime 正常触发重编。注意：diff 为空时不能走 grep -f（busybox
              # 对空 pattern 文件行为不可靠），须单独处理。
              TMP_DIR=$(mktemp -d)
              git -C openssl-build diff --name-only "$BEFORE" HEAD | sort > "$TMP_DIR/changed"
              T=$(( $(date +%s) - 172800 ))
              (
                cd openssl-build
                if [[ -s "$TMP_DIR/changed" ]]; then
                  git ls-files | grep -vxF -f "$TMP_DIR/changed" > "$TMP_DIR/rewind" || true
                else
                  git ls-files > "$TMP_DIR/rewind"
                fi
                if [[ -s "$TMP_DIR/rewind" ]]; then
                  xargs touch -d "@$T" < "$TMP_DIR/rewind"
                fi
              )
              echo "⏪ [诊断] rewound $(wc -l < "$TMP_DIR/rewind" 2>/dev/null || echo 0) tracked files to epoch ${T} (changed today: $(wc -l < "$TMP_DIR/changed"))"
              rm -rf "$TMP_DIR"
              echo "✅ OpenSSL source updated to ${REF}"
            else
              echo "⚠️ fetch/reset failed (ref switched?), re-cloning ..."
              rm -rf openssl-build
            fi
          fi
          if [[ ! -d openssl-build/.git ]]; then
            echo "📦 OpenSSL: git clone --depth 1 --branch ${REF} (cache miss)"
            rm -rf openssl-build
            git clone --depth 1 --branch "${REF}" https://github.com/openssl/openssl.git openssl-build
          fi

          # 版本号从 VERSION.dat 读取（3.0+ 才有该文件；1.1.1 等老线明确报错不兼容）
          if [[ ! -f openssl-build/VERSION.dat ]]; then
            echo "❌ VERSION.dat not found: 仅支持 OpenSSL 3.0+，ref '${REF}' 可能是老版本线"; exit 1
          fi
          # grep -m1 代替 | head -1：head 会提前关管道，pipefail 下 find/grep
          # 可能被 SIGPIPE 杀死（exit 141），set -e 直接终止
          MAJOR=$(grep -m1 -E '^MAJOR=' openssl-build/VERSION.dat | cut -d= -f2)
          MINOR=$(grep -m1 -E '^MINOR=' openssl-build/VERSION.dat | cut -d= -f2)
          PATCH=$(grep -m1 -E '^PATCH=' openssl-build/VERSION.dat | cut -d= -f2)
          # || true：发布 tag 的 VERSION.dat 里 PRE_RELEASE_TAG 可能为空行/缺失，
          # grep 无匹配时 pipefail 会杀掉整条管道，不能让它误伤正常流程
          PRE=$(grep -m1 -E '^PRE_RELEASE_TAG=' openssl-build/VERSION.dat | cut -d= -f2 || true)
          [[ -z "$MAJOR" ]] && { echo "❌ Cannot parse VERSION.dat"; exit 1; }
          OPENSSL_VER="${MAJOR}.${MINOR}.${PATCH}"
          if [[ -n "$PRE" ]]; then OPENSSL_VER="${OPENSSL_VER}-${PRE}"; fi
          echo "version=${OPENSSL_VER}" >> "$GITHUB_OUTPUT"
          OSSL_COMMIT=$(git -C openssl-build rev-parse --short HEAD)
          echo "commit=${OSSL_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "✅ OpenSSL: ${OPENSSL_VER} (${REF}@${OSSL_COMMIT})"

          cd openssl-build
          # Configure 选项（注释不能插进续行，统一写这里）：
          # no-shared: 只出静态库    no-async: musl 静态编译必需
          # no-module: provider 编进 libcrypto（全静态 CLI 无法 dlopen 外部 .so）
          # -static:   Configure 认识该选项并透传给编译/链接器，CLI 全静态
          CONFIG_OPTS=(--prefix=/usr/local no-shared no-async no-module -static)

          # 每轮都重跑 Configure：openssl 4.x 的 make 会自检 configdata.pm 与源码
          # 状态是否一致，跳过反而触发它的"配置已变更"机制、强制重配全量重编。
          # 但 Configure 每次都会重写生成头文件、mtime 变新、所有依赖它的 .o 重编
          # ——所以先备份旧头文件，Configure 后内容没变的用 touch -r 恢复旧 mtime，
          # make 只重编真正变化的文件；内容真变了保留新 mtime，正常触发重编。
          GEN_FILES=(include/openssl/configuration.h include/openssl/opensslconf.h
                     apps/include/configuration.h apps/include/opensslconf.h configdata.pm)
          BAK_DIR=$(mktemp -d)
          for f in "${GEN_FILES[@]}"; do
            [[ -f "$f" ]] && cp -p "$f" "$BAK_DIR/$(echo "$f" | tr '/' '_')"
          done

          ./config "${CONFIG_OPTS[@]}"
          rm -f .workflow-config-fp   # 清理旧方案的指纹标记

          # configdata.pm 是全部 make 期生成文件（公开头文件/err 头/.inc）的前置
          # 依赖：它被重写后所有生成头文件都会重新生成，进而全量重编。
          # 内容没变就恢复旧 mtime，保住 configdata.pm < 生成头文件 < .o 的顺序。
          for f in "${GEN_FILES[@]}"; do
            B="$BAK_DIR/$(echo "$f" | tr '/' '_')"
            if [[ -f "$f" && -f "$B" ]] && cmp -s "$f" "$B"; then
              touch -r "$B" "$f"
            fi
          done
          rm -rf "$BAK_DIR"

          # [诊断] 时间戳链检查：期望 build.info/Configure < configdata.pm <
          # 生成头文件 < .o。任何一处顺序颠倒都对应一类全量重编。
          echo "=== [诊断] mtime chain（从上到下应递增）==="
          for f in crypto/build.info Configure configdata.pm \
                   include/openssl/configuration.h include/openssl/asn1.h; do
            [[ -f "$f" ]] && stat -c '%y  %n' "$f"
          done
          # sed -n '1p' 代替 | head -1：sed 会读完整个输入，避免 pipefail 下的
          # SIGPIPE（exit 141）误杀（上一轮就是被这个诊断行自己绊倒的）
          FIRST_O=$(find apps crypto ssl providers -name '*.o' -type f 2>/dev/null | sed -n '1p')
          [[ -n "$FIRST_O" ]] && stat -c '%y  %n' "$FIRST_O"
          echo "build.info newer than configdata.pm: $(find . -name build.info -newer configdata.pm | wc -l)（>0 会触发强制重配）"

          # 失败分级兜底：openssl 检测到 configdata.pm 过期时会自动重跑 Configure
          # 并报错要求"再跑一次 make"，此时直接重试即可保住增量产物；
          # 重试仍失败才 make clean 全量重编
          if ! make -j"$(nproc)" build_sw; then
            echo "⚠️ make requested a re-run (configdata.pm refreshed), retrying ..."
            if ! make -j"$(nproc)" build_sw; then
              echo "⚠️ retry failed, falling back to full rebuild ..."
              make clean || true
              ./config "${CONFIG_OPTS[@]}"
              make -j"$(nproc)" build_sw
            fi
          fi
          echo "=== [诊断] recompiled .o: $(find . -name '*.o' -newer configdata.pm | wc -l)/$(find . -name '*.o' | wc -l)（newer than configdata.pm，越小说明增量越有效）"
          make install_sw install_ssldirs DESTDIR="$TOOLCHAIN_DIR"

          OPENSSL_BIN="$TOOLCHAIN_DIR/usr/local/bin/openssl"
          [[ -x "$OPENSSL_BIN" ]] || { echo "❌ openssl binary missing after install"; exit 1; }

          echo "=== OpenSSL toolchain verification ==="
          file "$OPENSSL_BIN"
          ldd "$OPENSSL_BIN" 2>&1 || echo "✅ Fully static binary confirmed"
          BUILT_VER="$("$OPENSSL_BIN" version)"
          [[ "$BUILT_VER" == "OpenSSL ${OPENSSL_VER}"* ]] \
            || { echo "❌ Built version mismatch: ${BUILT_VER} != ${OPENSSL_VER}"; exit 1; }
          "$OPENSSL_BIN" version -a
          "$OPENSSL_BIN" list -providers

          strip "$OPENSSL_BIN"
          cd "$GITHUB_WORKSPACE"   # miss 分支进过 openssl-build/，切回工作区根目录

          # 装进容器的 /usr/local，供 nginx 用 -I/-L 链接（容器每轮全新，无残留）
          cp -a "$TOOLCHAIN_DIR/usr/local/." /usr/local/

          ARCHIVE="openssl-${OPENSSL_VER}_linux-amd64-static.tar.gz"
          # 带 usr/local 前缀打包，解压到 / 即并入 /usr/local
          tar czf "${ARCHIVE}" -C "$TOOLCHAIN_DIR" usr/local
          echo "📦 Output: ${ARCHIVE} ($(ls -lh "${ARCHIVE}" | awk '{print $5}'))"
          echo "openssl_archive_name=${ARCHIVE}" >> "$GITHUB_ENV"

      # ── 7. 保存 OpenSSL 构建树缓存 ───────────────────────────────
      # key 含 run_id 每轮唯一，所以无条件保存；旧条目由 Prune 步骤清理
      - name: Save OpenSSL build tree cache
        uses: actions/cache/save@v4
        with:
          path: openssl-build
          key: openssl-build-v1-${{ github.run_id }}

      # ── 8. 更新 Nginx 源码与第三方模块 ───────────────────────────
      - name: Download and update sources
        id: nginx
        shell: bash
        run: |
          set -euo pipefail

          # 缓存命中（含 objs/）→ 增量更新源码；不 clean，保留编译产物做增量编译
          if [[ -d nginx-master/.git ]]; then
            echo "⏭️ Nginx build tree restored from cache, updating to latest master ..."
            BEFORE=$(git -C nginx-master rev-parse HEAD)
            if git -C nginx-master fetch --depth 1 origin master \
               && git -C nginx-master reset --hard FETCH_HEAD; then
              # 同 OpenSSL 步骤：reset --hard 重写全部跟踪文件的 mtime，
              # 回拨未变化文件到 48h 前的固定时间戳（严格早于所有 .o）
              TMP_DIR=$(mktemp -d)
              git -C nginx-master diff --name-only "$BEFORE" HEAD | sort > "$TMP_DIR/changed"
              T=$(( $(date +%s) - 172800 ))
              (
                cd nginx-master
                if [[ -s "$TMP_DIR/changed" ]]; then
                  git ls-files | grep -vxF -f "$TMP_DIR/changed" > "$TMP_DIR/rewind" || true
                else
                  git ls-files > "$TMP_DIR/rewind"
                fi
                if [[ -s "$TMP_DIR/rewind" ]]; then
                  xargs touch -d "@$T" < "$TMP_DIR/rewind"
                fi
              )
              echo "⏪ [诊断] rewound $(wc -l < "$TMP_DIR/rewind" 2>/dev/null || echo 0) tracked files to epoch ${T} (changed today: $(wc -l < "$TMP_DIR/changed"))"
              rm -rf "$TMP_DIR"
              echo "✅ Nginx source updated"
            else
              echo "⚠️ fetch/reset failed, re-cloning ..."
              rm -rf nginx-master
            fi
          fi
          if [[ ! -d nginx-master/.git ]]; then
            echo "📦 Nginx: git clone --depth 1 https://github.com/nginx/nginx.git (master, cache miss)"
            rm -rf nginx-master
            git clone --depth 1 --branch master https://github.com/nginx/nginx.git nginx-master
          fi
          # GitHub 仓库不含根目录 configure（官方 release tarball 独有）。
          # 已 diff 验证：auto/configure 与官方 tarball 根 configure 内容一致，直接复制补齐
          cp nginx-master/auto/configure nginx-master/configure
          chmod +x nginx-master/configure

          # 版本号取自即将编译的本地源码，保证与编译产物一致
          # src/core/nginx.h: #define NGINX_VERSION      "1.31.9"
          NGINX_VER=$(grep -oE '#define NGINX_VERSION[[:space:]]+"[^"]+"' nginx-master/src/core/nginx.h \
            | grep -oE '[0-9]+(\.[0-9]+)+' || true)
          [[ -z "$NGINX_VER" ]] && { echo "❌ Cannot resolve nginx version from master source"; exit 1; }
          echo "version=${NGINX_VER}" >> "$GITHUB_OUTPUT"
          # 记录源码 commit，供 Release 描述标注开发快照来源
          NGINX_COMMIT=$(git -C nginx-master rev-parse --short HEAD)
          echo "commit=${NGINX_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "✅ Nginx: ${NGINX_VER} (master@${NGINX_COMMIT})"

          # PCRE2 源码：缓存未命中才下载（key 按版本，命中即同一版本无需更新）
          # PCRE2 由 nginx --with-pcre 自行静态编译，不依赖系统包
          if [[ "${{ steps.pcre2-cache.outputs.cache-hit }}" != "true" ]]; then
            PCRE2_VER="${{ steps.pcre2.outputs.version }}"
            echo "📦 PCRE2: ${PCRE2_VER} (cache miss)"
            curl -fL --retry 3 -o pcre2.tar.gz \
              "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-${PCRE2_VER}/pcre2-${PCRE2_VER}.tar.gz"
            tar xzf pcre2.tar.gz
            rm -rf pcre2-src
            mv "pcre2-${PCRE2_VER}" pcre2-src
          else
            echo "⏭️ PCRE2 cache hit: ${{ steps.pcre2.outputs.version }}"
          fi

          curl -fL --retry 3 -o headers-more-nginx-module.tar.gz \
            https://github.com/openresty/headers-more-nginx-module/archive/refs/heads/master.tar.gz
          tar xzf headers-more-nginx-module.tar.gz

          curl -fL --retry 3 -o nginx-http-flv-module.tar.gz \
            https://github.com/winshining/nginx-http-flv-module/archive/refs/heads/master.tar.gz
          tar xzf nginx-http-flv-module.tar.gz

          curl -fL --retry 3 -o nginx_cookie_flag_module.tar.gz \
            https://github.com/AirisX/nginx_cookie_flag_module/archive/refs/heads/master.tar.gz
          tar xzf nginx_cookie_flag_module.tar.gz

          # ngx_brotli 依赖 deps/brotli 子模块，GitHub archive 不含子模块，必须 git clone
          git clone --recursive --depth 1 \
            https://github.com/google/ngx_brotli.git ngx_brotli

      # ── 9. 静态编译 Nginx ────────────────────────────────────────
      # 每轮重跑 configure（几秒）刷新 objs/Makefile，make 只重编改动的文件；
      # 增量失败（上游大改头文件依赖、删除源文件等）则清空 objs 全量重编兜底。
      # 注意：configure 续行之间插入 # 注释会被反斜杠吞掉，注释写在参数数组上方
      - name: Configure and build static Nginx
        shell: bash
        run: |
          set -euo pipefail

          # ── 编译静态 brotli 库（filter 需要 enc+common，static 还需要 dec）──
          ( cd ngx_brotli/deps/brotli \
            && mkdir -p out && cd out \
            && cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
                 -DCMAKE_C_FLAGS="-O2" .. \
            && cmake --build . --config Release \
                 --target brotlienc brotlicommon brotlidec -j"$(nproc)" )

          cd nginx-master

          # OpenSSL：-I/-L 链接第 6 步装入 /usr/local 的工具链静态库
          # （gcc 默认搜索路径本就含 /usr/local，显式 -I/-L 只是加固）
          CONFIGURE_ARGS=(
            --prefix=/usr/local/nginx
            --error-log-path=/var/log/nginx/error.log
            --http-log-path=/var/log/nginx/access.log
            --pid-path=/var/run/nginx.pid
            --lock-path=/var/run/nginx.lock
            --with-compat
            --with-threads
            --with-http_stub_status_module
            --with-http_ssl_module
            --with-http_realip_module
            --with-http_v2_module
            --with-http_v3_module
            --with-stream
            --with-stream_realip_module
            --with-stream_ssl_module
            --with-stream_ssl_preread_module
            --with-http_gzip_static_module
            --with-http_gunzip_module
            --with-http_mp4_module
            --with-pcre-jit
            --with-debug
            --without-select_module
            --without-poll_module
            --without-http_userid_module
            --without-http_mirror_module
            --without-http_autoindex_module
            --with-http_sub_module
            --without-http_fastcgi_module
            --without-http_uwsgi_module
            --without-http_scgi_module
            --without-http_memcached_module
            --without-mail_pop3_module
            --without-mail_imap_module
            --without-mail_smtp_module
            --without-http_ssi_module
            --with-pcre=../pcre2-src
            --add-module=../headers-more-nginx-module-master
            --add-module=../nginx_cookie_flag_module-master
            --add-module=../nginx-http-flv-module-master
            --add-module=../ngx_brotli
            '--with-cc-opt=-O2 -I/usr/local/include'
            '--with-ld-opt=-static -L/usr/local/lib64 -lpthread -ldl -lstdc++ -lm'
          )

          # 每轮都重跑 configure（重新扫描 auto/ 与各模块，保证 Makefile 与最新
          # 源码一致，不会漏编新增文件）。但 configure 会重写 objs/ngx_auto_config.h
          # 等，mtime 变新导致所有 .o 重编——先备份，configure 后内容没变的
          # 恢复旧 mtime，增量才有效；内容真变了保留新 mtime，正常触发重编。
          GEN_FILES=(objs/ngx_auto_config.h objs/ngx_auto_headers.h objs/ngx_modules.c)
          run_configure() {
            local BAK_DIR B f
            BAK_DIR=$(mktemp -d)
            for f in "${GEN_FILES[@]}"; do
              [[ -f "$f" ]] && cp -p "$f" "$BAK_DIR/$(basename "$f")"
            done
            ./configure "${CONFIGURE_ARGS[@]}"
            for f in "${GEN_FILES[@]}"; do
              B="$BAK_DIR/$(basename "$f")"
              if [[ -f "$f" && -f "$B" ]] && cmp -s "$f" "$B"; then
                touch -r "$B" "$f"
              fi
            done
            rm -rf "$BAK_DIR"
          }
          echo "🔧 Running configure ..."
          run_configure

          if ! make -j"$(nproc)"; then
            echo "⚠️ incremental build failed, falling back to full rebuild ..."
            rm -rf objs
            run_configure
            make -j"$(nproc)"
          fi

          echo ""
          echo "=== [诊断] recompiled .o: $(find objs -name '*.o' -newer objs/ngx_auto_config.h 2>/dev/null | wc -l)/$(find objs -name '*.o' 2>/dev/null | wc -l)（newer than ngx_auto_config.h）"
          echo "=== Binary verification ==="
          file objs/nginx
          ldd objs/nginx 2>&1 || echo "✅ Static binary confirmed (no dynamic deps)"
          ls -lh objs/nginx

      # ── 10. 保存 Nginx 构建树缓存（含 objs/，供下轮增量编译）─────
      # key 含 run_id 每轮唯一，所以无条件保存；旧条目由 Prune 步骤清理
      - name: Save Nginx build tree cache
        uses: actions/cache/save@v4
        with:
          path: nginx-master
          key: nginx-master-v1-${{ github.run_id }}

      # ── 11. 保存 PCRE2 缓存（含编译产物，key 按版本，不变则只存一次）──
      - name: Save PCRE2 cache
        if: steps.pcre2-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: pcre2-src
          key: pcre2-v1-${{ steps.pcre2.outputs.version }}

      # ── 12. 打包产物 ─────────────────────────────────────────────
      - name: Strip and package
        shell: bash
        run: |
          OPENSSL_VER="${{ steps.openssl.outputs.version }}"
          NGINX_VER="${{ steps.nginx.outputs.version }}"
          ARCHIVE="nginx-${NGINX_VER}_openssl-${OPENSSL_VER}_linux-amd64-static.tar.gz"

          strip "nginx-master/objs/nginx"
          tar czf "${ARCHIVE}" -C "nginx-master/objs" nginx

          echo "📦 Output: ${ARCHIVE} ($(ls -lh "${ARCHIVE}" | awk '{print $5}'))"
          echo "archive_name=${ARCHIVE}" >> "$GITHUB_ENV"

      # ── 13. 发布到 Releases（固定 latest，保留最新的一对文件）────
      - name: Publish to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ env.archive_name }}
          OPENSSL_ARCHIVE: ${{ env.openssl_archive_name }}
        run: |
          set -euo pipefail
          TAG="latest"
          # master 源码的版本宏是开发中版本号，描述以 <ref>@commit 标识来源，
          # 不以官方发布版口吻呈现
          # 样式统一为 <ref>@<commit> (<版本>)，与 Telegram 通知一致
          NOTES="nginx master@${{ steps.nginx.outputs.commit }} (${{ steps.nginx.outputs.version }}) + openssl ${{ steps.openssl.outputs.ref }}@${{ steps.openssl.outputs.commit }} (${{ steps.openssl.outputs.version }}) 全静态编译"

          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 删掉旧资产，保证 release 下只有最新的一对文件
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
              | while read -r asset; do
                  echo "🗑️ Deleting old asset: ${asset}"
                  gh release delete-asset "$TAG" "$asset" -R "$GITHUB_REPOSITORY" --yes
                done
            # 描述同步刷新为本轮构建的版本号
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$NOTES"
            gh release upload "$TAG" "$ARCHIVE" "$OPENSSL_ARCHIVE" -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" "$OPENSSL_ARCHIVE" -R "$GITHUB_REPOSITORY" \
              --title "nginx static build (linux-amd64)" \
              --notes "$NOTES"
          fi

          echo "🚀 Released: ${ARCHIVE} + ${OPENSSL_ARCHIVE} -> tag ${TAG}"

      # ── 14. 清理被取代的旧缓存 ───────────────────────────────────
      # 只在成功时执行：失败轮次保留旧缓存，下轮还能增量命中。
      # keep 列表 = 本轮刚保存的 key；同时也清掉旧方案遗留的 openssl-toolchain-*
      - name: Prune superseded caches
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          KEEP=(
            "nginx-master-v1-${{ github.run_id }}"
            "openssl-build-v1-${{ github.run_id }}"
            "pcre2-v1-${{ steps.pcre2.outputs.version }}"
          )
          PREFIXES=(nginx-master- openssl-build- openssl-toolchain- pcre2-v1-)

          gh cache list -R "$GITHUB_REPOSITORY" --limit 100 --json key,id \
            --jq '.[] | "\(.id)\t\(.key)"' \
            | while IFS=$'\t' read -r ID KEY; do
                MATCH=false
                for P in "${PREFIXES[@]}"; do
                  [[ "$KEY" == "$P"* ]] && MATCH=true
                done
                $MATCH || continue
                for K in "${KEEP[@]}"; do
                  [[ "$KEY" == "$K" ]] && MATCH=false
                done
                $MATCH || continue
                echo "🗑️ Deleting stale cache: ${KEY}"
                gh cache delete "$ID" -R "$GITHUB_REPOSITORY" || echo "(already gone)"
              done
          echo "✅ Cache pruned"

  # ── 15. Telegram 通知（成功失败都发）─────────────────────────
  notify:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Telegram notification
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESULT: ${{ needs.build.result }}
          NGINX_VER: ${{ needs.build.outputs.nginx_ver }}
          NGINX_COMMIT: ${{ needs.build.outputs.nginx_commit }}
          OPENSSL_VER: ${{ needs.build.outputs.openssl_ver }}
          OPENSSL_REF: ${{ needs.build.outputs.openssl_ref }}
          OPENSSL_COMMIT: ${{ needs.build.outputs.openssl_commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name == 'schedule' && '⏰ 定时' || github.event_name == 'workflow_dispatch' && '🔧 手动' || github.event_name }}
        run: |
          if [[ "$RESULT" == "success" ]]; then ICON="✅"; else ICON="❌"; fi
          TEXT="${ICON} [nginx-build] ${RESULT} (${TRIGGER}) | nginx: master@${NGINX_COMMIT:-?} (${NGINX_VER:-?}) / openssl: ${OPENSSL_REF:-?}@${OPENSSL_COMMIT:-?} (${OPENSSL_VER:-?})
          ${RUN_URL}"
          curl -sS --fail -o /dev/null -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode "text=${TEXT}"
