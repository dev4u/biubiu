# .github/workflows/build-nginx-static.yml
name: Build Static Nginx

on:
  workflow_dispatch:
    inputs:
      openssl_major:
        description: 'OpenSSL 版本前缀 (如: 3.4 / 3.3 / 3.2 / 1.1.1)'
        required: true
        default: '4.0'
      nginx_major:
        description: 'Nginx 版本前缀 (如: 1.28 / 1.26 / 1.25)'
        required: true
        default: '1.31'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.21   # musl libc，天然适合全静态编译

    steps:
      # ── 1. 安装编译依赖 ──────────────────────────────────────────
      - name: Install build dependencies
        run: |
          apk add --no-cache \
             linux-headers \
             musl-dev \
             cmake \
             build-base \
             pcre-dev \
             zlib-dev \
             zlib-static \
             curl \
             tar \
             bash \
             vim \
             git \
             perl \
             tzdata \
             ca-certificates \
             jq \
             brotli-dev \
             brotli-static
      # ── 2. 解析 OpenSSL 最新小版本号 ─────────────────────────────
      - name: Resolve latest OpenSSL version
        id: openssl
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="${{ inputs.openssl_major }}"
          ESCAPED="${PREFIX//./\\.}"

          echo "🔍 Searching OpenSSL ${PREFIX}.x ..."

          # 优先：官方 source 页（当前维护版本）
          LATEST=$(curl -sf "https://www.openssl.org/source/" \
            | grep -oE "openssl-${ESCAPED}(\.[0-9]+|[a-z])\.tar\.gz" \
            | sed 's/\.tar\.gz//' | sort -V | tail -1 || true)

          # 其次：旧版归档页
          if [[ -z "$LATEST" ]]; then
            LATEST=$(curl -sf "https://www.openssl.org/source/old/${PREFIX}/" \
              | grep -oE "openssl-${ESCAPED}(\.[0-9]+|[a-z])\.tar\.gz" \
              | sed 's/\.tar\.gz//' | sort -V | tail -1 || true)
          fi

          # 兜底：GitHub Tags API（处理未归档的新版）
          if [[ -z "$LATEST" ]]; then
            for PAGE in 1 2 3 4 5; do
              RAW=$(curl -sf \
                "https://api.github.com/repos/openssl/openssl/tags?per_page=100&page=${PAGE}") || break
              [[ -z "$RAW" || "$RAW" == "[]" ]] && break

              MATCH=$(echo "$RAW" \
                | grep -oE '"openssl-[^"]+"' | tr -d '"' \
                | grep -E "^openssl-${ESCAPED}(\.[0-9]+|[a-z])$" \
                | sort -V | tail -1 || true)
              [[ -n "$MATCH" ]] && LATEST="$MATCH" && break

              COUNT=$(echo "$RAW" | grep -c '"name"' || echo 0)
              [[ $COUNT -lt 100 ]] && break
            done
          fi

          [[ -z "$LATEST" ]] && { echo "❌ No OpenSSL found for prefix: ${PREFIX}"; exit 1; }

          VER="${LATEST#openssl-}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "✅ OpenSSL: ${VER}"

      # ── 3. 解析 Nginx 最新小版本号 ───────────────────────────────
      - name: Resolve latest Nginx version
        id: nginx
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="${{ inputs.nginx_major }}"
          ESCAPED="${PREFIX//./\\.}"

          echo "🔍 Searching Nginx ${PREFIX}.x ..."

          LATEST=$(curl -sf "https://nginx.org/en/download.html" \
            | grep -oE "nginx-${ESCAPED}\.[0-9]+" \
            | sort -V | tail -1 || true)

          [[ -z "$LATEST" ]] && { echo "❌ No Nginx found for prefix: ${PREFIX}"; exit 1; }

          VER="${LATEST#nginx-}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "✅ Nginx: ${VER}"

      # ── 4. 下载源码 ───────────────────────────────────────────────
      - name: Download sources
        shell: bash
        run: |
          set -euo pipefail
          OPENSSL_VER="${{ steps.openssl.outputs.version }}"
          NGINX_VER="${{ steps.nginx.outputs.version }}"
          MINOR_PREFIX="${OPENSSL_VER%.*}"

          # 优先 current source，回退到 old archive
          PRIMARY="https://www.openssl.org/source/openssl-${OPENSSL_VER}.tar.gz"
          FALLBACK="https://www.openssl.org/source/old/${MINOR_PREFIX}/openssl-${OPENSSL_VER}.tar.gz"

          if wget -q --spider "${PRIMARY}" 2>/dev/null; then
            echo "📦 OpenSSL (current): ${PRIMARY}"
            wget -q "${PRIMARY}"
          else
            echo "📦 OpenSSL (archive): ${FALLBACK}"
            wget -q "${FALLBACK}"
          fi

          echo "📦 Nginx: https://nginx.org/download/nginx-${NGINX_VER}.tar.gz"
          wget -q "https://nginx.org/download/nginx-${NGINX_VER}.tar.gz"

          tar xzf "openssl-${OPENSSL_VER}.tar.gz"
          tar xzf "nginx-${NGINX_VER}.tar.gz"

          wget -q https://github.com/openresty/headers-more-nginx-module/archive/refs/heads/master.tar.gz \
            -O headers-more-nginx-module.tar.gz
          tar xzf headers-more-nginx-module.tar.gz

          wget -q https://github.com/winshining/nginx-http-flv-module/archive/refs/heads/master.tar.gz \
            -O nginx-http-flv-module.tar.gz
          tar xzf nginx-http-flv-module.tar.gz

          wget -q https://github.com/AirisX/nginx_cookie_flag_module/archive/refs/heads/master.tar.gz \
            -O nginx_cookie_flag_module.tar.gz
          tar xzf nginx_cookie_flag_module.tar.gz


      # ── 5. 静态编译 ───────────────────────────────────────────────
      - name: Configure and build static Nginx
        shell: bash
        run: |
          set -euo pipefail
          OPENSSL_VER="${{ steps.openssl.outputs.version }}"
          NGINX_VER="${{ steps.nginx.outputs.version }}"

          cd "nginx-${NGINX_VER}"

          ./configure \
            --prefix=/usr/local/nginx \
            --error-log-path=/var/log/nginx/error.log \
            --http-log-path=/var/log/nginx/access.log \
            --pid-path=/var/run/nginx.pid \
            --lock-path=/var/run/nginx.lock \
            --with-compat \
            --with-threads \
            --with-http_stub_status_module \
            --with-http_ssl_module \
            --with-http_realip_module \
            --with-http_v2_module \
            --with-http_v3_module \
            --with-stream \
            --with-stream_realip_module \
            --with-stream_ssl_module \
            --with-stream_ssl_preread_module \
            --with-http_gzip_static_module \
            --with-http_gunzip_module \
            --with-http_mp4_module \
            --with-pcre-jit \
            --with-debug \
            --without-select_module \
            --without-poll_module \
            --without-http_userid_module \
            --without-http_mirror_module \
            --without-http_autoindex_module \
            --with-http_sub_module \
            --without-http_fastcgi_module \
            --without-http_uwsgi_module \
            --without-http_scgi_module \
            --without-http_memcached_module \
            --without-mail_pop3_module \
            --without-mail_imap_module \
            --without-mail_smtp_module \
            --without-http_ssi_module \
            --with-openssl="../openssl-${OPENSSL_VER}" \
            --with-openssl-opt="no-shared no-async" \
            --add-module="../headers-more-nginx-module-master" \
            --add-module="../nginx-http-flv-module-master" \
            --add-module="../nginx_cookie_flag_module-master" \
            --with-cc-opt="-O2" \
            --with-ld-opt="-static -lpthread -ldl -lstdc++ -lm"

          make -j$(nproc)

          echo ""
          echo "=== Binary verification ==="
          file objs/nginx
          ldd objs/nginx 2>&1 || echo "✅ Static binary confirmed (no dynamic deps)"
          ls -lh objs/nginx

      # ── 6. 打包产物 ───────────────────────────────────────────────
      - name: Strip and package
        shell: bash
        run: |
          OPENSSL_VER="${{ steps.openssl.outputs.version }}"
          NGINX_VER="${{ steps.nginx.outputs.version }}"
          ARCHIVE="nginx-${NGINX_VER}_openssl-${OPENSSL_VER}_linux-amd64-static.tar.gz"

          strip "nginx-${NGINX_VER}/objs/nginx"
          tar czf "${ARCHIVE}" -C "nginx-${NGINX_VER}/objs" nginx

          echo "📦 Output: ${ARCHIVE} ($(ls -lh "${ARCHIVE}" | awk '{print $5}'))"
          echo "archive_name=${ARCHIVE}" >> "$GITHUB_ENV"

      # ── 7. 上传 Artifact ──────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-${{ steps.nginx.outputs.version }}-openssl-${{ steps.openssl.outputs.version }}-static
          path: "*.tar.gz"
          retention-days: 30
