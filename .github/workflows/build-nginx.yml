name: Build Nginx with OpenSSL 4.0

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 允许手动触发

env:
  OPENSSL_VERSION: 4.0.3
  NGINX_VERSION: 1.31.6

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 1. 缓存预编译好的 OpenSSL include 和 lib 目录
      # 只要 OPENSSL_VERSION 不变，后续构建会直接命中缓存，跳过 OpenSSL 编译
      # -----------------------------------------------------------------
      - name: OpenSSL 编译结果缓存
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: ~/openssl-build
          key: openssl-${{ env.OPENSSL_VERSION }}-alpine

      # -----------------------------------------------------------------
      # 2. 如果未命中缓存，在 Alpine 容器中编译 OpenSSL 4.0
      # -----------------------------------------------------------------
      - name: 编译 OpenSSL (未命中缓存时执行)
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/openssl-build
          docker run --rm \
            -v ~/openssl-build:/opt/openssl \
            alpine:latest sh -c "
              apk add --no-cache build-base wget perl linux-headers && \
              wget https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz && \
              tar -zxvf openssl-${OPENSSL_VERSION}.tar.gz && \
              cd openssl-${OPENSSL_VERSION} && \
              ./config no-shared --prefix=/opt/openssl --openssldir=/opt/openssl && \
              make -j\$(nproc) && \
              make install_sw
            "

      # -----------------------------------------------------------------
      # 3. 编译 Nginx（直接加载缓存中的 OpenSSL 头文件与静态库）
      # -----------------------------------------------------------------
      - name: 编译 Nginx (静态链接预编译好的 OpenSSL)
        run: |
          mkdir -p ./out
          docker run --rm \
            -v ~/openssl-build:/opt/openssl \
            -v $(pwd)/out:/out \
            alpine:latest sh -c "
              apk add --no-cache build-base wget pcre-dev zlib-dev linux-headers && \
              wget https://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz && \
              tar -zxvf nginx-${NGINX_VERSION}.tar.gz && \
              cd nginx-${NGINX_VERSION} && \
              ./configure \
                --prefix=/usr/local/nginx \
                \
                --error-log-path=/var/log/nginx/error.log \
                --http-log-path=/var/log/nginx/access.log \
                --pid-path=/var/run/nginx.pid \
                --lock-path=/var/run/nginx.lock \
                \
                --with-compat \
                --with-threads \
                \
                --with-http_stub_status_module \
                --with-http_ssl_module \
                --with-http_realip_module \
                --with-http_v2_module \
                --with-http_v3_module \
                \
                --with-stream \
                --with-stream_realip_module \
                --with-stream_ssl_module \
                --with-stream_ssl_preread_module \
                \
                --with-http_gzip_static_module \
                --with-http_gunzip_module \
                --with-http_mp4_module \
                --with-http_sub_module \
                \
                --with-pcre-jit \
                --with-debug \
                \
                --without-select_module \
                --without-poll_module \
                \
                --without-http_userid_module \
                --without-http_mirror_module \
                --without-http_autoindex_module \
                \
                --without-http_fastcgi_module \
                --without-http_uwsgi_module \
                --without-http_scgi_module \
                --without-http_memcached_module \
                \
                --without-http_ssi_module \
                \
                --without-mail_pop3_module \
                --without-mail_imap_module \
                --without-mail_smtp_module \
                --with-cc-opt='-I/opt/openssl/include' \
                --with-ld-opt='-L/opt/openssl/lib -Wl,-rpath,/opt/openssl/lib' && \
              make -j\$(nproc) && \
              cp objs/nginx /out/nginx
            "

      # -----------------------------------------------------------------
      # 4. 上传编译产物（只有几兆大小的纯静态/半静态二进制文件）
      # -----------------------------------------------------------------
      - name: 上传打包好的 Nginx 二进制文件
        uses: actions/upload-artifact@v4
        with:
          name: nginx-openssl4
          path: ./out/nginx